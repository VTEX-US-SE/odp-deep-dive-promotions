<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promotions Playbook</title>

<style>
  :root{
    --paper:#FFFFFF;
    --paper-raised:#F3F4F6;
    --ink:#17151C;
    --ink-soft:#4A4650;
    --slate:#6E6A78;
    --pink:#F71963;
    --pink-dim:#FDE4EC;
    --pink-ink:#F71963;
    --native:#1E9E5A;
    --native-dim:#E3F5EA;
    --custom:#B98900;
    --custom-dim:#FBF1D2;
    --line:#E4E5E8;
    --line-strong:#D4D6DA;
    --focus:#2C6BE8;
    --shadow: 0 1px 2px rgba(23,21,28,.04), 0 8px 24px rgba(23,21,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15131B; --paper-raised:#1D1A24; --ink:#F3F0F5; --ink-soft:#C7C1D0; --slate:#A29CB0;
      --pink:#FF3D7F; --pink-dim:#3A1526; --pink-ink:#FF6C9C;
      --native:#4ADE80; --native-dim:#173322;
      --custom:#F2C94C; --custom-dim:#3A2E0E;
      --line:#2A2733; --line-strong:#38333F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15131B; --paper-raised:#1D1A24; --ink:#F3F0F5; --ink-soft:#C7C1D0; --slate:#A29CB0;
    --pink:#FF3D7F; --pink-dim:#3A1526; --pink-ink:#FF6C9C;
    --native:#4ADE80; --native-dim:#173322;
    --custom:#F2C94C; --custom-dim:#3A2E0E;
    --line:#2A2733; --line-strong:#38333F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;}
  a{color:var(--pink-ink); text-decoration:none;}
  a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px;}
  button{font:inherit;}

  /* ---------- Sticky header (top bar + requirement menu, as one block) ---------- */
  .sticky-head{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--paper);}
  .topbar{background:var(--paper);}
  .topbar-inner{max-width:1180px; margin:0 auto; padding:18px 20px 14px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{height:30px; padding:0 10px; border-radius:8px; background:var(--pink); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; letter-spacing:.03em; white-space:nowrap; flex:none;}
  .brand-text .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--slate); display:block;}
  .brand-text h1{font-size:19px; font-weight:600;}
  /* ---------- Level 1: requirement menu ---------- */
  .l1-wrap{background:var(--paper); border-bottom:1px solid var(--line);}
  .l1{max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; flex-wrap:wrap; gap:8px;}
  .l1-btn{flex:1 1 132px; display:flex; flex-direction:column; gap:2px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised); cursor:pointer; text-align:left; color:var(--ink-soft); min-width:132px;}
  .l1-btn .n{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--slate);}
  .l1-btn .t{font-size:12.5px; font-weight:600; line-height:1.25; color:var(--ink);}
  .l1-btn[aria-pressed="true"]{background:var(--pink); border-color:var(--pink);}
  .l1-btn[aria-pressed="true"] .n{color:rgba(255,255,255,.75);}
  .l1-btn[aria-pressed="true"] .t{color:#fff;}
  .l1-btn .flag{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
  .l1-btn .flag.native,
  .l1-btn .flag.mostly{color:var(--native);}
  .l1-btn .flag.custom{color:var(--custom);}
  .l1-btn[aria-pressed="true"] .flag{color:rgba(255,255,255,.85) !important;}

  /* ---------- Level 2: capability submenu ---------- */
  .l2-wrap{background:var(--paper-raised); border-bottom:1px solid var(--line);}
  .l2-head{max-width:1180px; margin:0 auto; padding:16px 20px 0; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .l2-head h2{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate);}
  .l2-head a{font-size:12px; color:var(--pink);}
  .l2{max-width:1180px; margin:0 auto; padding:10px 20px 16px; display:flex; flex-wrap:wrap; gap:8px;}
  .l2-btn{
    display:flex; align-items:center; gap:8px; padding:9px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; font-size:13px;
  }
  .l2-btn .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .l2-btn .dot.native{background:var(--native);}
  .l2-btn .dot.custom{background:var(--custom);}
  .l2-btn[aria-pressed="true"]{background:var(--pink-dim); border-color:var(--pink); font-weight:600;}

  /* ---------- Content panel ---------- */
  main{max-width:1180px; margin:0 auto; padding:26px 20px 64px;}
  .panel-head{display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-start; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .panel-head .id{font-family:"IBM Plex Mono",monospace; color:var(--slate); font-size:13px;}
  .panel-head h2{font-size:25px; font-weight:650; margin-top:4px; max-width:640px;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid transparent;}
  .badge.native{background:var(--native-dim); color:var(--native); border-color:var(--native);}
  .badge.custom{background:var(--custom-dim); color:var(--custom); border-color:var(--custom);}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .content-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:28px; align-items:start;}
  .content-grid.no-test{grid-template-columns:1fr;}
  @media (max-width:900px){ .content-grid{grid-template-columns:1fr;} }

  .text-col{display:flex; flex-direction:column; gap:20px;}

  .block h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); margin-bottom:10px;}
  .block p{font-size:15px; line-height:1.72; color:var(--ink); margin:0;}
  .block p + p{margin-top:13px;}
  .block.config p{color:var(--ink-soft);}
  .block .howto{margin:13px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:10px;}
  .block .howto li{font-size:14.5px; line-height:1.68; color:var(--ink);}
  .block .howto li b{font-weight:650;}
  .block .howto li code{font-family:"IBM Plex Mono",monospace; font-size:12.5px; background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; padding:1px 5px;}
  .block .howto + p{margin-top:13px;}

  .doclinks{display:flex; flex-direction:column; align-items:flex-start; gap:8px;}
  .doclink{font-size:15px; font-weight:600; color:var(--pink); word-break:break-word; display:inline-block;}
  .doclink:hover{text-decoration:underline;}

  /* ---------- How-to-test panel (right column) ---------- */
  .test-col{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--head-h, 150px) + 16px); display:flex; flex-direction:column; gap:10px;}
  .test-card{border-radius:16px; border:1px solid var(--line); background:var(--paper-raised); padding:22px; box-shadow:var(--shadow);}
  .test-card.is-open{border:1.5px dashed var(--line-strong); box-shadow:none; background:var(--paper);}
  .test-status{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px;}
  .test-status.tested{background:var(--native-dim); color:var(--native);}
  .test-status.open{background:var(--custom-dim); color:var(--custom);}
  .test-card h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); margin-bottom:10px;}
  .test-name{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 10px; display:inline-block; margin-bottom:12px; word-break:break-word;}
  .admin-link-row{margin:0 0 16px;}
  .admin-link-row .label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); margin-bottom:4px;}
  .admin-link-full{font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.5; color:var(--pink-ink); word-break:break-all; display:inline-block;}
  .test-caution{font-size:12.5px; line-height:1.55; color:var(--custom); background:var(--custom-dim); border-radius:8px; padding:9px 12px; margin:0 0 14px;}
  .test-steps-list{margin:0 0 18px; padding-left:20px; display:flex; flex-direction:column; gap:9px;}
  .test-steps-list li{font-size:14.5px; line-height:1.62; color:var(--ink);}
  .cart-btn-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
  .cart-btn{display:inline-flex; align-items:center; gap:7px; background:var(--pink); color:#fff !important; font-weight:600; font-size:13px; padding:10px 16px; border-radius:10px; text-decoration:none !important;}
  .cart-btn:hover{opacity:.9;}
  .test-open-note{font-size:13.5px; line-height:1.62; color:var(--slate); margin:0;}
  .test-case{padding-top:18px; margin-top:18px; border-top:1px solid var(--line);}
  .test-case:first-of-type{padding-top:0; margin-top:0; border-top:0;}
  .test-case h4{font-size:14px; margin:0 0 10px;}
  .media-caption{font-size:12px; color:var(--slate); line-height:1.55; padding:0 2px;}
</style>
</head>
<body>


<div class="sticky-head" id="stickyHead">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">VTEX</div>
        <div class="brand-text">
          <span class="eyebrow">VTEX + Office Depot &middot; Promotions Deep-Dive Session</span>
          <h1>Promotions Playbook</h1>
        </div>
      </div>
    </div>
  </div>

  <div class="l1-wrap">
    <div class="l1" id="l1bar" role="tablist" aria-label="Requirements"></div>
  </div>
</div>

<div class="l2-wrap">
  <div class="l2-head">
    <h2 id="l2label">Capabilities</h2>
  </div>
  <div class="l2" id="l2bar" role="tablist" aria-label="Capabilities"></div>
</div>

<main id="panelHost"></main>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script>
(function(){
  var PUBLIC_DOCS = {
    promotions: ["Promotions & Taxes overview", "https://help.vtex.com/en/docs/tutorials/promotions-overview"],
    campaign: ["Creating a campaign promotion", "https://help.vtex.com/en/docs/tutorials/campaign-promotion"],
    campaignAudience: ["Creating a campaign audience", "https://help.vtex.com/en/docs/tutorials/creating-a-campaign-audience"],
    regular: ["Creating a regular promotion", "https://help.vtex.com/en/docs/tutorials/regular-promotion"],
    bogo: ["Buy One Get One promotions", "https://help.vtex.com/en/docs/tutorials/buy-one-get-one"],
    buyTogether: ["Creating a Buy Together promotion", "https://help.vtex.com/en/docs/tutorials/buy-together"],
    progressive: ["Progressive Discount promotions", "https://help.vtex.com/en/docs/tutorials/progressive-discount"],
    competition: ["Promotion competition and combination", "https://help.vtex.com/docs/tutorials/how-promotion-competition-works"],
    pricing: ["Pricing overview", "https://developers.vtex.com/docs/guides/pricing-overview"],
    priceTableBenefit: ["Creating a promotion using a price table", "https://help.vtex.com/en/docs/tutorials/how-to-create-a-benefit-using-price-table"],
    userPriceTables: ["Configuring price tables for specific users", "https://help.vtex.com/en/docs/tutorials/setting-up-price-tables-for-specific-users"],
    coupons: ["Coupons", "https://help.vtex.com/en/docs/tutorials/coupons-beta"],
    couponsApi: ["Creating and managing coupons with the Promotions API", "https://developers.vtex.com/docs/guides/creating-and-managing-coupons-with-promotions-api"],
    customerCluster: ["Creating a promotion for a customer cluster", "https://help.vtex.com/en/docs/tutorials/creating-promotion-for-a-customer-cluster"],
    employeeBenefits: ["Configuring employee benefits with customer clusters", "https://help.vtex.com/en/docs/tutorials/configure-employee-benefits-using-master-data-clusters"],
    subscription: ["Creating a subscription promotion", "https://help.vtex.com/en/docs/tutorials/creating-a-subscription-promotion"],
    reward: ["Regular promotion with reward value", "https://help.vtex.com/en/docs/tutorials/regular-promotion-with-reward-value"],
    shipping: ["Configuring shipping promotions", "https://help.vtex.com/en/docs/tutorials/configuring-shipping-promotions"],
    promotionsApi: ["Promotions & Taxes API overview", "https://developers.vtex.com/docs/guides/rates-and-benefits-api-overview"],
    cxPlatform: ["VTEX CX Platform: overview", "https://help.vtex.com/docs/tutorials/vtex-cx-platform-overview"],
    cxAgents: ["Official agents from VTEX CX Platform", "https://help.vtex.com/en/docs/tutorials/official-agents-from-vtex-cx-platform"],
    giftCard: ["Setting up gift cards", "https://help.vtex.com/docs/tutorials/gift-card"],
    giftCardApi: ["Managing VTEX gift cards with the GiftCard API", "https://developers.vtex.com/docs/guides/managing-vtex-gift-cards"]
  };
  var CART_HOST = "https://officedepotdev.myvtex.com/checkout/cart/add?";

  function cart(items, opts){
    opts = opts || {};
    var parts = ["sc="+(opts.sc || 2), "redirect=true"];
    items.forEach(function(it){
      parts.push("sku="+it.id+"&qty="+it.qty+"&seller="+(it.seller || 1));
    });
    return CART_HOST + parts.join("&");
  }

  var TOPICS = [
    { n:1, title:"Full Promotional Mechanics Engine", flag:"native",
      docs:[PUBLIC_DOCS.promotions],
      caps:[
        ["Buy 1 Get 1 Free (same SKU)","native",
          "Campaign promotions define the conditions under which a discount should trigger &mdash; most often a specific SKU sitting in the cart. A straightforward Buy-One-Get-One offer is a classic example: a shopper who adds a qualifying item receives a second, identical unit as a free gift, at no cost to them. This is the kind of promotion ODP would run on a hero product to drive basket size during a campaign window.",
          "This is built as a VTEX Campaign promotion of type buyAndWin. The rule says: buy one unit of the SKU, get one more unit of that same SKU as a gift, capped at one gift per cart so the offer can't be stacked by adding extra units. Eligibility is gated by a campaign audience &mdash; in the assessment build, a specific customer email &mdash; so the discount only shows up for shoppers who match that audience, and disappears for anyone else. The promotion is configured as not cumulative, meaning it won't combine with any other active discount on the same cart.",
          {status:"tested", vtexName:"[Assessment] C01 Buy 1 Get 1 Free Same SKU", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/c44729cc-aac3-4adf-80f9-cfeff8d7abd4",
           steps:[
             "Click <b>Add to Cart</b> below to open a fresh cart in officedepotdev already loaded with 2 units of SKU 172791 (Composition Book).",
             "Log in, or set the checkout profile, to <b>assessment.c01@officedepot.example</b> &mdash; this is the only audience the promotion is gated to.",
             "Expected result: one of the two units should show as a free gift, selling price US$0.",
             "Negative check: repeat without that email and confirm the gift does not appear."
           ],
           cart:[{label:"Add 2&times; SKU 172791", url:cart([{id:172791,qty:2}])}]}],
        ["Buy X Get Y at % off","native",
          "This is the &ldquo;buy one thing, get a discount on another&rdquo; pattern from ODP's blueprint: buying select paper products (X) unlocks a percentage off a specific ink or toner SKU (Y). It lets merchandising pair a high-traffic item with a margin-friendly cross-sell, without changing the price of the X item itself.",
          "Configured as a Campaign promotion where the audience condition requires the X SKU to be present in the cart. The reward &mdash; a percentage discount &mdash; is scoped narrowly to the Y SKU only, capped at one discounted unit per cart. Each Buy X Get Y campaign uses its own dedicated audience so similar-looking rules, like a dollar-off variant of the same pairing, don't compete with each other.",
          {status:"tested", vtexName:"[Assessment] C02 Buy X Get Y 20 Percent Off", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/c35df4b0-cb4a-4377-a531-2d3625f8e82e",
           steps:[
             "Click <b>Add to Cart</b> to load SKU 925382 (paper, item X) and SKU 3919316 (ink, item Y) together.",
             "Set the checkout profile to <b>assessment.c02@officedepot.example</b>.",
             "Expected result: the ink should show 20% off; the paper stays at list price, and only one unit of ink receives the discount."
           ],
           cart:[{label:"Add SKU 925382 + 3919316", url:cart([{id:925382,qty:1},{id:3919316,qty:1}])}]}],
        ["Buy X Get Y at $ off","native",
          "The dollar-off sibling of the percentage mechanic above: buying select items (X) unlocks a flat dollar discount on a paired item (Y), useful when ODP wants to guarantee an exact savings amount rather than a variable percentage &mdash; a flat $5 off ink when a shopper buys paper, for example.",
          "Same Campaign promotion structure as the percentage variant, but the reward is expressed as a nominal dollar amount rather than a percentage, still capped to a single affected unit of the Y SKU. It runs on its own dedicated audience, separate from the percentage-off version, so the two rules never conflict on the same cart.",
          {status:"tested", vtexName:"[Assessment] C03 Buy X Get Y 5 Dollars Off", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/b14e4c88-d336-4499-a7a0-aa9d2eb55813",
           steps:[
             "Click <b>Add to Cart</b> to load SKU 925382 and SKU 3919316 together.",
             "Set the checkout profile to <b>assessment.c03@officedepot.example</b>.",
             "Expected result: the ink should receive US$5 off; the paper should not take this discount."
           ],
           cart:[{label:"Add SKU 925382 + 3919316", url:cart([{id:925382,qty:1},{id:3919316,qty:1}])}]}],
        ["Spend threshold reward &mdash; % off","native",
          "A &ldquo;spend and get rewarded&rdquo; mechanic: once a shopper's basket of qualifying items (Y) crosses a minimum dollar amount, they unlock a percentage discount on a different item (Z). ODP's own example was spending $100 on general supplies to get 20% off a case of paper &mdash; rewarding a larger office-supply basket rather than a single-item purchase.",
          "Built as a Campaign promotion with a spend-floor condition: the audience only qualifies once the cart total for the named Y SKUs crosses the configured dollar amount. Where a broad category like &ldquo;Office Supplies&rdquo; doesn't reliably capture every descendant SKU, the assessment build lists the qualifying SKUs explicitly instead of relying on the parent category. The reward is a percentage off the Z SKU, capped to a single affected unit.",
          {status:"tested", vtexName:"[Assessment] C04 Spend 100 Get Z 20 Percent Off", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/8e2dc812-e543-45ea-ad53-896270485d4b",
           steps:[
             "Click <b>Add to Cart</b> to load the qualifying spend bundle &mdash; SKUs 9999918, 9999916, and 2&times; 9999839 clear the $100 floor &mdash; plus SKU 925382, the reward item (Z).",
             "Set the checkout profile to <b>assessment.c04@officedepot.example</b>.",
             "Expected result: the paper (925382) should show 20% off.",
             "Negative check: remove the qualifying bundle and keep only the paper &mdash; the campaign should not fire."
           ],
           cart:[{label:"Add qualifying bundle + paper", url:cart([{id:9999918,qty:1},{id:9999916,qty:1},{id:9999839,qty:2},{id:925382,qty:1}])}]}],
        ["Spend threshold reward &mdash; $ off","native",
          "The same spend-and-reward mechanic as above, but with a guaranteed dollar amount off instead of a percentage &mdash; for shoppers who spend $100 on qualifying supplies, get a flat $10 off a case of paper, for example.",
          "Identical Campaign structure and spend-floor condition to the percentage variant, with the reward expressed as a nominal dollar discount on the Z SKU instead of a percentage.",
          {status:"tested", vtexName:"[Assessment] C05 Spend 100 Get Z 10 Dollars Off", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/aee23f83-51a3-4686-bbae-c9a28f8ab7ce",
           steps:[
             "Click <b>Add to Cart</b> to load the same qualifying spend bundle as above.",
             "Set the checkout profile to <b>assessment.c05@officedepot.example</b>.",
             "Expected result: the paper (925382) should receive US$10 off."
           ],
           cart:[{label:"Add qualifying bundle + paper", url:cart([{id:9999918,qty:1},{id:9999916,qty:1},{id:9999839,qty:2},{id:925382,qty:1}])}]}],
        ["Fixed price rewards","native",
          "Instead of a discount off the regular price, this mechanic reprices the reward item to an exact promotional price once the spend threshold is met &mdash; ODP's example was spending $100 on supplies to get a case of paper for exactly $11.99, regardless of what it would normally cost.",
          "Built as a Campaign promotion using maximumUnitPriceDiscount to cap the unit price of the Z SKU at the promotional amount, combined with a limit on how many units can receive that price (three, in the assessment build) and how many times a single customer can redeem it &mdash; so the fixed price can't be exploited by adding an unlimited quantity of the reward item.",
          {status:"tested", vtexName:"[Assessment] C06 Spend 100 Get Z at 11.99", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/b03d6719-a325-45c0-8a09-e8df47de5e4d",
           steps:[
             "Click <b>Add to Cart</b> to load the qualifying spend bundle plus 4 units of paper (925382) &mdash; enough to test the promotion's 3-unit cap.",
             "Set the checkout profile to <b>assessment.c06@officedepot.example</b>.",
             "Expected result: up to 3 units of paper should be re-priced to US$11.99 each; the 4th unit should stay at the regular price."
           ],
           cart:[{label:"Add bundle + 4&times; paper", url:cart([{id:9999918,qty:1},{id:9999916,qty:1},{id:9999839,qty:2},{id:925382,qty:4}])}]}],
        ["Selected SKU % off (coupon-gated)","native",
          "Sometimes ODP doesn't want a discount to be broadly visible &mdash; it should only apply when a shopper enters a specific code, distributed through a targeted channel like an email campaign or a customer-service interaction. This gives merchandising a percentage-off lever they can hand to a specific segment without exposing it to every visitor.",
          "A Regular promotion carrying a percentage discount on the chosen SKU, gated behind a coupon code tied to a matching UTM source and campaign. Without entering the code, the shopper sees the regular price; with it, the discount applies immediately. The promotion is not cumulative, so it won't stack with another active discount on the same item.",
          {status:"tested", vtexName:"[Assessment] R01 Selected SKU 20 Percent Off", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/c268e320-6476-4cbd-b672-4647fa9a7187",
           steps:[

           cart:[{label:"Add SKU 172791", url:cart([{id:172791,qty:1}])}]}],
        ["Selected SKU $ off (coupon-gated)","native",

           cart:[{label:"Add SKU 3919316", url:cart([{id:3919316,qty:1}])}]}],
        ["Quantity-limited sale price","native",
          "This mechanic lets ODP advertise a sale price on a limited number of units &mdash; &ldquo;first 10 units at this price, regular price after that&rdquo; &mdash; common for doorbuster-style offers where the business wants to cap how many units go out at the promotional price without manually tracking inventory.",
          "A Regular promotion (not the forThePriceOf type, which VTEX's validation rejects when the minimum quantity is lower than the quantity to affect) that fixes the unit price for up to a defined number of units via maximumUnitPriceDiscount and maxNumberOfAffectedItems. Any units beyond that cap automatically revert to the regular price within the same cart.",
          {status:"tested", vtexName:"[Assessment] R03 Item at Fixed Price Limit 10", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/fa846fe8-b6ca-4c7d-bd12-532ac08e27bb",

        ["Buy More, Save More tiered threshold","native",
          "ODP wants shoppers who spend more to save proportionally more &mdash; spend $150 and save $20, spend $300 and save $50, spend $500 or more and save $75. It's a classic tiered incentive to grow basket size; ODP also called out wanting an item-count version of the same idea (&ldquo;Buy More Save Binders: 1&ndash;5 units 20% off, 6&ndash;10 units 25% off, 11+ units 30% off&rdquo;).",
          "This is supported natively with separate Regular promotions for each spend band, each configured with a cart-total floor and ceiling and a nominal cart-level discount. The bands share one coupon code and are non-cumulative, so the promotion matching the current subtotal applies the appropriate $20, $50, or $75 savings.",
          {status:"tested", vtexName:"[Assessment] R04&ndash;R06 Spend 150/300/500 Save 20/50/75", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/6a57d7de-79ff-44b0-aa36-0fa37245e9ce",

        ["Progressive quantity discount","native",

          "Built using VTEX's native progressive promotion type on a single SKU, with quantity break-points &mdash; in the assessment build, 1, 6, and 11 units &mdash; each mapped to its own percentage. As the shopper's quantity crosses a break-point, the higher discount tier applies automatically to the whole line.",
          {status:"tested", vtexName:"[Assessment] R07 Progressive Quantity 20 25 30", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/9bd1eb6d-7c27-48cc-94d3-d91856f91fbe",

        ["Clearance markdown","native",

          {status:"tested", vtexName:"[Assessment] P01 Clearance Pricing", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/814de66d-b359-4bf3-ae8e-d2f99d8ac53a",

        ["First-time customer discounts","native",
          "A welcome-style incentive aimed at converting a first-time visitor into a customer &mdash; 25% off their very first order after signing up with an email address, for example. It's meant to apply exactly once per shopper, not on every subsequent order.",
          "A Regular promotion using the isFirstBuy condition, so VTEX itself determines eligibility based on purchase history rather than a manually maintained list. The assessment build disables &ldquo;optimistic&rdquo; first-buy matching, so a guest checkout with no purchase history behind it isn't treated as a first-time buyer just because the system has no record to check &mdash; the discount is reserved for genuinely new, identified customers.",
          {status:"tested", vtexName:"[Assessment] R09 First Purchase 25 Percent", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/47cf00a8-f74c-407a-ba21-5574c385f73f",
           steps:[

             "Apply coupon code <b>assess-r09</b>.",
             "Expected result: the book should show 25% off.",
             "Negative check: repeat checkout with the same identified customer, or as a guest with no purchase history &mdash; the discount should not re-apply."

           cart:[{label:"Add SKU 172791", url:cart([{id:172791,qty:1}])}]}],
        ["% off / $ off (Instant Savings)","native",
          "This is ODP's everyday markdown mechanic &mdash; &ldquo;20% off all office furniture&rdquo; or &ldquo;$50 off select printers&rdquo; &mdash; scoped to a customer segment, a set of products, or a collection, running for a defined window of time. It's the workhorse promotion type behind most sitewide and category-level sales.",
          "Built as a Price Table promotion: IPS calculates and pushes the final discounted price per SKU into a dedicated price table, and VTEX serves that price to any shopper whose session maps to it. Because the original list price is retained alongside the discounted selling price, the storefront can show both &mdash; the crossed-out &ldquo;was&rdquo; price next to the current &ldquo;now&rdquo; price &mdash; for as long as the promotion window is active.",
          {status:"tested", vtexName:"[Assessment] P04 Instant Savings Visible", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/f0883924-4b49-4538-9520-ad3822fe0500",
           steps:[
             "Open a cart session mapped to the assessment-instant price table, then click <b>Add to Cart</b> to load SKU 925382.",
             "Expected result: the selling price should show as US$29.99 with a list price of US$35.62 visible alongside it on both the listing and product pages."
           ],
           cart:[{label:"Add SKU 925382", url:cart([{id:925382,qty:1}])}]}],
        ["Best price logic","native",
          "When multiple eligible promotions affect the same item and have the same discount type, VTEX runs promotion competition to determine the outcome that provides the greatest benefit to the shopper. Promotions of different effect types, or promotions that affect different products, do not compete and can be combined automatically.",
          "VTEX applies promotions in a predefined order by effect type: progressive discounts first; then percentage and fixed-amount price discounts; bundles and maximum unit prices; shipping discounts; gifts; formulas; surcharges; and reward amounts. Within the same type, promotions are ordered by discount value, prioritizing the greatest discount. Non-combinable promotions compete under the account's competition strategy (scenario-based by default), while eligible combinable promotions are applied afterward to the already-discounted amount.",
          {hide:true}],
        ["Bundle discounts (single basket &amp; group)","custom",
          "Bundling &mdash; discounting a group of items purchased together, whether within one basket or across a shopper's broader purchase &mdash; is a mechanic ODP currently runs through its in-store systems for retail locations. The source label is POS-only / custom build; VTEX's native equivalent is a Buy Together (combo) promotion, which is what was built in the assessment account so ODP can see the same basket mechanic on the platform.",
          "Configured as a native combo: both SKUs must be in the cart, and the second SKU then receives 10% off. Eligibility is gated to the assessment profile. Removing either SKU drops the benefit, which is the behavior that distinguishes a bundle from two independent item discounts.",
          {status:"tested", vtexName:"[Assessment] G01 Bundle Buy Together Custom Build", adminUrl:"https://officedepotdev.myvtex.com/admin/promotions/0dd02f7a-19ed-4a32-8935-8cc55e02d002",
           steps:[
             "Set the checkout profile to <b>assessment.g01.bundle@officedepot.example</b>.",
             "Click <b>Add to Cart</b> to load SKU 6028288 and SKU 664011 together.",
             "Expected result: the G01 promotion ID should appear in the cart's price tags or rate-and-benefits identifiers, and the second SKU should show 10% off.",
             "Negative check: remove either SKU and confirm G01 disappears."
           ],
           cart:[{label:"Add SKU 6028288 + 664011", url:cart([{id:6028288,qty:1},{id:664011,qty:1}])}]}],
      ]

        ["Stackability rules","native",

        ["Business Select (BizSelect) discount tiers","native",

        ["BLP / offer stacking logic","native",
          "Loyalty offers often need to combine with whatever else is already discounting the cart &mdash; a member price alongside a sitewide sale, for instance &mdash; rather than being mutually exclusive with everything else. At the same time, ODP needs a guarantee that a shopper can never chain offers into a compounded discount the business didn't intend, and that when two offers overlap the shopper always lands on the best legitimate price.",
          [
            "There is no rules engine to build here. Stacking behavior in VTEX comes from two native settings working together: a per-promotion <b>cumulative</b> flag that decides whether an offer is allowed to combine with others, and the account-level <b>competition strategy</b> that decides who wins when two non-cumulative offers overlap on the same item. Implementing BLP is therefore a configuration and governance exercise, not a development one.",
            {steps:[
              "<b>Classify every loyalty offer as stackable or exclusive.</b> Build a simple matrix of ODP's active offer types &mdash; Reward Member pricing, Business Select pricing, Service Depot Dollars, sitewide coupons, employee tiers &mdash; and decide, for each pair, whether they should ever appear on the same item. This matrix is the actual BLP policy; everything below is just expressing it in Admin.",
              "<b>Set the cumulative flag per promotion.</b> In each promotion, the <code>cumulative</code> setting (<i>&ldquo;This promotion is cumulative with other promotions&rdquo;</i>) marks it as combinable. Loyalty markers meant to always ride alongside another discount &mdash; Service Depot Dollars is the canonical example &mdash; are set cumulative. Everyday percentage and dollar-off promotions stay non-cumulative so they compete instead of compounding.",
              "<b>Let non-cumulative offers compete.</b> When two non-cumulative promotions of the same discount type hit a common item, VTEX evaluates the possible scenarios and applies the one that gives the shopper the greatest benefit. That competition <i>is</i> best-price logic &mdash; ODP does not need to pre-rank offers or compute the winner in advance.",
              "<b>Understand the order the survivors apply in.</b> Combinable promotions are applied after the winning non-combinable one, on the amount that has already been discounted &mdash; so stacked offers compound on a reduced base, not on the list price. Within that pass, VTEX follows a fixed order by effect type (progressive, then percentage and nominal discounts, bundles and maximum unit price, shipping, gifts, formulas, surcharges, and reward amounts) and, inside a type, orders by discount value. This ordering is what makes a stacked outcome predictable enough to model before launch.",
              "<b>Put a floor under the stack.</b> Where the business needs a hard limit rather than a policy, use the native guardrails already on every promotion: scope the offer narrowly by SKU, category, collection, or brand; cap exposure with <code>maxNumberOfAffectedItems</code>, <code>maxUsage</code>, and <code>maxUsagePerClient</code>; and for member pricing use a price table with a fixed floor price instead of a percentage, so no combination of discounts can drive the item below it.",
              "<b>Validate the matrix against real carts before launch.</b> Use the checkout simulation endpoint (<code>/api/checkout/pub/orderForms/simulation</code>) with a representative cart and customer profile, and read <code>ratesAndBenefitsData</code> in the response &mdash; it lists exactly which promotions were identified and applied. Running each row of the stacking matrix through simulation turns the policy into a repeatable regression test, so a new campaign can be checked against the whole existing offer portfolio before it goes live.",
              "<b>Govern it going forward.</b> Adopt a naming convention that carries the stacking intent in the promotion name, and keep the matrix as the source of truth. Because cumulative is a per-promotion toggle, the risk to manage over time isn't the engine &mdash; it's a new promotion created cumulative by mistake."
            ]},
            "The practical takeaway for ODP: exclusive behavior is the default and requires nothing, stacking is an explicit opt-in per promotion, and the &ldquo;best price wins&rdquo; outcome is handled by promotion competition rather than by logic ODP has to write or maintain."
          ],
          {hide:true}],
        ["Service Depot Dollars (BizSelect year-1 offer)","native",
          [
            "Depot Dollars are the $10 credits a Business Select member receives as part of the membership &mdash; five of them per membership year. The way the program runs today, ODP mints roughly a million individual coupons to deliver them, one batch per member, and only about a tenth of those codes are ever redeemed. The cost isn't the discount, it's the operation: a million codes to generate, distribute, expire, and reissue every year, with no easy way to change the offer once it's out.",
            "The problem to solve is therefore not &ldquo;how do we give $10 off&rdquo; &mdash; that part is trivial. It's how to make entitlement follow the membership automatically, so a code exists only while the member is in the right contract year, and stops working the moment they aren't."
          ],
          [
            "The answer is to move eligibility off the coupon and onto the customer. The membership tier &mdash; <code>BS1</code>, <code>BS2</code>, <code>BS3</code>, one per contract year &mdash; is written to the shopper's <b>CL (Client) profile in Master Data</b>, and the promotions simply read it. Codes stop being personal; the tier on the profile is what makes them work.",
            {steps:[
              "<b>Write the tier to the CL entity when the member joins or renews.</b> The field on the VTEX Client profile is the only integration point in the design, and everything downstream keys off it.",
              "<b>Create permanent promotions, one per coupon code per membership year.</b> Size this against an assumed five-year member lifetime: five general codes usable once per customer, one promotion behind each code, per active year &mdash; 25 promotions and 25 coupons in total. That is the whole program, replacing roughly a million minted codes.",
              "<b>Gate each promotion with a customer cluster condition on the tier.</b> A BS2 promotion carries a cluster condition requiring <code>tier=BS2</code>, so it's visible and usable only to members currently in their second year. A first-year member sees the BS1 set and nothing else &mdash; not because the codes were withheld from them, but because the condition doesn't match.",
              "<b>Use shared codes with a per-customer cap instead of serialized ones.</b> Because the cluster already restricts <i>who</i> can redeem, the code itself no longer needs to be unique per shopper. Setting <code>maxUsagePerClient</code> to 1 enforces &ldquo;once per member,&rdquo; which is what the serialized batch was really there to do. It also opens the door to memorable marketing codes &mdash; the demo build runs <code>VIP10</code>, <code>MEMBER10</code>, and <code>ACCESS10</code> alongside the generated ones.",
              "<b>Make the promotions cumulative.</b> Depot Dollars are a membership benefit, not a competing offer, so each promotion is set cumulative and stacks on whatever sale or member price is already on the cart rather than displacing it.",
              "<b>Stop expiring coupons &mdash; expire the tier.</b> This is the pivot that makes the model work operationally. The promotions never expire; the tier does. At the end of the contract year the member is updated to the next tier or the tier is removed, and access flips on its own. Revoking a member's benefit is a single profile change, not a code sweep."
            ]},
            "One open item carries over from the proposal: for in-store redemption, ODP still needs to confirm whether applying the coupon through the cart simulation call is enough to activate the promotion from POS. That's the same question raised under Guest / POS checkout redemption in Requirement #3, and it's worth resolving once for both."
          ],
          {status:"tested", statusLabel:"Demo build in odpdev", cases:[
            {title:"Test case 1 &mdash; First-year member (BS1)", vtexName:"Promotion 1st Year &mdash; BS1", adminUrl:"https://odpdev.myvtex.com/admin/promotions/c4815e41-8792-4922-93e9-f90f2e85e232",
             steps:[
               "Note this demo lives in the <b>odpdev</b> account, not officedepotdev &mdash; it predates the [Assessment] batch.",
               "Open a cart in odpdev with the BS1-tagged profile <b>felipe.dias+bs1@vtex.com</b> and add any qualifying item.",

        ["Price match","native",
          "A price-match policy lets a shopper request that ODP match a lower price found elsewhere &mdash; a customer-service-driven discount rather than a broadly advertised promotion. It is granted one shopper at a time, after an agent reviews the competitor's price, so it can never be a published offer sitting in the catalog.",
          [

            {steps:[
              "<b>Write the policy as promotion boundaries first.</b> Decide the maximum discount the match may reach, which categories are eligible, and how long a matched price stays valid. These become the ceiling and scope of the promotion template, so an agent can never grant more than the policy allows.",
              "<b>Create one Regular promotion as the price-match template.</b> Scope it to the eligible categories, set it non-cumulative so a matched price can't stack on top of another active discount, and cap it with <code>maxNumberOfAffectedItems</code> so a single approval discounts one unit rather than a whole cart line.",
              "<b>Issue a serialized, single-use coupon per approval.</b> The same serialized-coupon mechanic already validated under Requirement #3: generate the code against the template promotion with <code>maxUsage</code> and <code>maxUsagePerClient</code> set to 1. Codes can be pre-minted in a batch for the service team to draw from, or generated on demand through the Promotions API at the moment the agent approves the match.",
              "<b>Hand the request to the CX Platform.</b> VTEX CX Platform connects natively to the catalog, checkout, OMS, and promotions, so the price-match conversation happens where the agent already is &mdash; webchat, WhatsApp, or email. Its Promotions Agent can look up the item and apply the offer inside the conversation, and hand off to a human when the request falls outside policy.",
              "<b>Handle post-purchase matches as an order change.</b> If the shopper already checked out, the match is a partial refund or order edit through the OMS rather than a new coupon &mdash; same policy, different module.",
              "<b>Track it.</b> Because every approval is a distinct coupon on one template promotion, coupon usage reporting gives the business price-match volume, average matched amount, and the SKUs being matched most often &mdash; which is usually the real signal the pricing team wants out of this program."
            ]},
            "Net result: the judgment call stays with customer service, where it belongs, while the discount itself is applied by a native, fully auditable VTEX promotion."
          ],
          {hide:true}],
        ["Trade-in discounts","custom",
          "ODP offers a trade-in program where a shopper can receive credit toward a new purchase by turning in an old device &mdash; a mechanic that today lives entirely within the in-store retail flow, where the device can be inspected and valued.",
          [
            "The blueprint flags this Retail Only: ODP's in-store system (IPS) continues to own trade-in valuation and credit, and no VTEX promotions integration is planned for it today. That said, if ODP ever wants the credit to be spendable online, VTEX already has a native home for it &mdash; and it isn't the promotions engine.",
            "<b>Trade-in credit is money, not a discount.</b> Its value is decided per device by an appraisal, it has to survive across sessions and orders, and it may be spent partially. Those are the properties of a stored balance, which is why the native fit is a <b>gift card</b> (VTEX's store credit, a payment method) or <b>loyalty points</b> through the rewards program &mdash; not a promotion, which computes a discount from cart contents at checkout time.",

              "<b>Make the balance appear at checkout without a code.</b> A gift card created with <code>relationName</code> set to <code>loyalty_program</code> is returned automatically to the identified shopper at checkout, so the trade-in credit simply shows up as available balance rather than requiring the shopper to key in a voucher number. One automatic card per customer is supported natively; multiple simultaneous balances would require an external gift card provider through the Giftcard Hub.",

  function getTopic(n){ return TOPICS.filter(function(t){ return t.n === n; })[0]; }
  function topicMenuFlag(t){
    var hasCustom = t.caps.some(function(c){ return c[1] === 'custom'; });
    return hasCustom ? 'mostly' : 'native';
  }
  function topicMenuLabel(flag){
    if (flag === 'mostly') return 'Mostly native';
    if (flag === 'native') return 'Native';
    return 'Custom build';
  }
  function getDocumentation(topic, capability){
    return CAPABILITY_DOCS[capability[0]] || topic.docs || [PUBLIC_DOCS.promotions];
  }

  function renderL1(){
    l1bar.innerHTML = '';
    TOPICS.forEach(function(t){
      var btn = document.createElement('button');
      btn.className = 'l1-btn';
      btn.setAttribute('aria-pressed', t.n === state.topic ? 'true' : 'false');
      var menuFlag = topicMenuFlag(t);
      btn.innerHTML =
        '<span class="n">#'+t.n+'</span>' +
        '<span class="t">'+t.title+'</span>' +
        '<span class="flag '+menuFlag+'">'+topicMenuLabel(menuFlag)+'</span>';
      btn.addEventListener('click', function(){
        state.topic = t.n;
        state.cap = t.caps[0][0];
        persist();
        renderL1(); renderL2(); renderPanel();
      });
      l1bar.appendChild(btn);
    });
  }

  function renderL2(){
    var t = getTopic(state.topic);
    l2label.textContent = 'Requirement #'+t.n+' · '+t.title.replace(/&amp;/g,'&')+' · '+t.caps.length+' capabilities';
    l2bar.innerHTML = '';
    t.caps.forEach(function(c){
      var btn = document.createElement('button');
      btn.className = 'l2-btn';
      btn.setAttribute('aria-pressed', c[0] === state.cap ? 'true' : 'false');
      btn.innerHTML = '<span class="dot '+c[1]+'"></span><span>'+c[0]+'</span>';
      btn.addEventListener('click', function(){
        state.cap = c[0];
        persist();
        renderL2(); renderPanel();
      });
      l2bar.appendChild(btn);
    });
  }

            '<div class="test-name">'+testCase.vtexName+'</div>' +
            '<div class="admin-link-row"><span class="label">Admin record</span><a class="admin-link-full" href="'+testCase.adminUrl+'" target="_blank" rel="noopener">'+testCase.adminUrl+'</a></div>' +
            '<ol class="test-steps-list">'+caseSteps+'</ol>' +
            caseCart +
          '</section>';
      }).join('');
      return '<div class="test-card">' +
          '<span class="test-status tested">'+statusLabel+'</span>' +
          '<h3>How to test this</h3>' +
          casesHtml +
        '</div>';
    }
    var stepsHtml = (test.steps||[]).map(function(s){return '<li>'+s+'</li>';}).join('');
    var cartHtml = '';
    if (test.cart && test.cart.length){
      cartHtml = '<div class="cart-btn-row">' + test.cart.map(function(c){
        return '<a class="cart-btn" href="'+c.url+'" target="_blank" rel="noopener">&#128722; '+c.label+'</a>';
      }).join('') + '</div>';
    }
    var cautionHtml = test.caution ? '<p class="test-caution">&#9888; '+test.caution+'</p>' : '';
    return '<div class="test-card">' +
        '<span class="test-status tested">'+statusLabel+'</span>' +
        '<h3>How to test this</h3>' +
        '<div class="test-name">'+test.vtexName+'</div>' +
        '<div class="admin-link-row"><span class="label">Admin record</span><a class="admin-link-full" href="'+test.adminUrl+'" target="_blank" rel="noopener">'+test.adminUrl+'</a></div>' +
        cautionHtml +
        '<ol class="test-steps-list">'+stepsHtml+'</ol>' +
        cartHtml +
      '</div>';
  }

  function renderRich(value){
    if (!(value instanceof Array)) return '<p>'+value+'</p>';
    return value.map(function(part){
      if (typeof part === 'string') return '<p>'+part+'</p>';
      if (part.steps) return '<ol class="howto">'+part.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>';
      return '';
    }).join('');
  }

  function renderPanel(){
    var t = getTopic(state.topic);
    var cap = t.caps.filter(function(c){ return c[0] === state.cap; })[0];
    if (!cap) return;
    var flag = cap[1], scenario = cap[2], config = cap[3], test = cap[4];
    var docsHtml = getDocumentation(t, cap).map(function(doc){
      return '<a class="doclink" href="'+doc[1]+'" target="_blank" rel="noopener">'+doc[0]+'</a>';
    }).join('');

    panelHost.innerHTML =
      '<div class="panel-head">' +
        '<div>' +
          '<div class="id mono">Requirement #'+t.n+' &middot; '+t.title+'</div>' +
          '<h2>'+cap[0]+'</h2>' +
        '</div>' +
        '<span class="badge '+flag+'">'+(flag==='native' ? 'Native &mdash; no custom dev' : 'Custom build / integration') + '</span>' +
      '</div>' +
      '<div class="content-grid'+(test && test.hide ? ' no-test' : '')+'">' +
        '<div class="text-col">' +
          '<div class="block">' +
            '<h3>Business Scenario</h3>' +
            renderRich(scenario) +
          '</div>' +
          '<div class="block config">' +
            '<h3>How It&rsquo;s Configured in VTEX</h3>' +
            renderRich(config) +
          '</div>' +
          '<div class="block">' +
            '<h3>Documentation</h3>' +
            '<div class="doclinks">'+docsHtml+'</div>' +
          '</div>' +
        '</div>' +
        (test && test.hide ? '' : '<div class="test-col">' + renderTestCard(test) + '</div>') +
      '</div>';
  }

  function persist(){
    try {
      sessionStorage.setItem('pp-topic', String(state.topic));
      sessionStorage.setItem('pp-cap', state.cap);
    } catch(e){}
  }

  if (!getTopic(state.topic).caps.some(function(c){ return c[0] === state.cap; })){
    state.cap = getTopic(state.topic).caps[0][0];
  }

  renderL1();
  renderL2();
  renderPanel();

  var stickyHead = document.getElementById('stickyHead');
  function syncHeadHeight(){
    if (!stickyHead) return;
    document.documentElement.style.setProperty('--head-h', stickyHead.offsetHeight + 'px');
  }
  syncHeadHeight();
  window.addEventListener('resize', syncHeadHeight);
  if (window.ResizeObserver){
    new ResizeObserver(syncHeadHeight).observe(stickyHead);
  }
})();
</script>

</body>
</html>
